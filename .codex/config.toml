# basix:local-access-default:start
default_permissions = "local-network-test-socket"
# basix:local-access-default:end
# basix:local-network-feature:start
[features]
network_proxy = true
# basix:local-network-feature:end
# basix:local-access-profile:start
[permissions.local-network-test-socket]
extends = ":workspace"

[permissions.local-network-test-socket.network]
enabled = true
mode = "limited"
allow_local_binding = true

[permissions.local-network-test-socket.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

[permissions.local-network-test-socket.network.unix_sockets]
"/home/codex/develop/basix/test/test.sock" = "allow"
# basix:local-access-profile:end
# basix:agent-config:start
[agents.basix_file_explorer]
config_file = "/home/codex/develop/basix/.codex/basix/agents/basix-file-explorer.toml"

[agents.basix_miraculix]
config_file = "/home/codex/develop/basix/.codex/basix/agents/basix-miraculix.toml"

[agents.basix_pager]
config_file = "/home/codex/develop/basix/.codex/basix/agents/basix-pager.toml"

[agents.basix_researcher]
config_file = "/home/codex/develop/basix/.codex/basix/agents/basix-researcher.toml"

[agents.basix_verifier]
config_file = "/home/codex/develop/basix/.codex/basix/agents/basix-verifier.toml"

# basix:agent-config:end
